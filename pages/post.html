<!DOCTYPE html>
<html lang="en" data-page="post">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>post — ojasprabhune</title>

  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/page.css" />

  <!-- Syntax highlighting theme — swaps between light/dark via syncHljsTheme() -->
  <link id="hljs-theme" rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />

  <script src="../js/theme.config.js"></script>
  <script src="../js/theme.js"></script>

  <!-- marked.js — Markdown → HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <!-- highlight.js — syntax highlighting for code blocks -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
    // Keep the highlight.js theme in sync with the site theme.
    function syncHljsTheme() {
      var link = document.getElementById('hljs-theme');
      if (!link) return;
      link.href = document.documentElement.dataset.theme === 'dark'
        ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css'
        : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
    }
    // Sync on load (theme.js already set data-theme before this runs).
    document.addEventListener('DOMContentLoaded', syncHljsTheme);
    // Re-sync whenever the toggle is pressed.
    var _origToggle = window.toggleThemeMode;
    window.toggleThemeMode = function () {
      if (_origToggle) _origToggle();
      syncHljsTheme();
    };
  </script>
</head>
<body>

  <div class="page-wrapper">
    <header class="page-header">
      <a href="javascript:history.back()" class="back-link" aria-label="Go back">back</a>
      <span class="page-title" id="postBreadcrumb"></span>
    </header>

    <main>
      <article class="post-page prose" id="postContent">
        <p class="loading">Loading…</p>
      </article>
    </main>
  </div>

  <button class="glass-surface theme-toggle" onclick="toggleThemeMode()" aria-label="Toggle dark mode">
    <span class="icon-light">☽</span>
    <span class="icon-dark">☀</span>
  </button>

  <nav class="glass-nav always-open is-visible" aria-label="Site navigation">
    <a href="../index.html"  class="glass-box glass-surface">.home</a>
    <a href="hobbies.html"   class="glass-box glass-surface">.hobbies</a>
    <a href="research.html"  class="glass-box glass-surface">.research</a>
    <a href="about.html"     class="glass-box glass-surface">.folders</a>
  </nav>

  <script src="../js/markdown.js"></script>
  <script src="../js/scroll.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var src    = params.get('src');

      if (!src) {
        document.getElementById('postContent').innerHTML =
          '<p class="error">No post specified. Add <code>?src=../posts/your-file.md</code> to the URL.</p>';
        return;
      }

      MarkdownLoader.render(src, '#postContent', '#postBreadcrumb');
    })();
  </script>
</body>
</html>
